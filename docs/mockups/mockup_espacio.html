<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity OS - Spatial Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f4f4f5; /* Zinc 100 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        /* Lienzo Infinito Base */
        .canvas-bg {
            position: absolute;
            width: 300vw; height: 300vh;
            top: -100vh; left: -100vw;
            background-image: radial-gradient(#d4d4d8 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            cursor: grab;
            z-index: 0;
        }
        .canvas-bg:active { cursor: grabbing; }

        /* Capa de UI - Siempre encima */
        .ui-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; /* Deja pasar clicks al lienzo */
            z-index: 50;
        }
        .ui-element { pointer-events: auto; } /* Reactiva clicks en los paneles */

        /* Panel Superior Izquierdo (Menú Oculto) */
        .top-left-menu {
            position: absolute; top: 20px; left: 20px;
            display: flex; align-items: center; gap: 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(228, 228, 231, 0.8);
            transition: all 0.2s;
        }

        /* Columna de Chat (Panel Lateral Izquierdo) */
        .chat-column {
            position: absolute; top: 80px; left: 20px; bottom: 20px;
            width: 340px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(228, 228, 231, 0.8);
            transform: translateX(-400px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
            opacity: 0;
            display: flex; flex-direction: column;
        }
        .chat-column.open {
            transform: translateX(0);
            opacity: 1;
        }

        /* Pomodoro & Player (Centro Arriba) */
        .dynamic-island {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; gap: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 8px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(228, 228, 231, 0.8);
        }

        /* Menú Circular Estilo "Concepts" (Derecha) */
        .concepts-wheel {
            position: absolute;
            top: 50%; right: 60px;
            transform: translateY(-50%);
            width: 240px; height: 240px;
        }

        .wheel-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70px; height: 70px;
            background: #6366f1; /* Índigo */
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4), inset 0 -3px 6px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 24px;
            cursor: pointer;
            z-index: 10;
            border: 3px solid white;
        }

        .wheel-tool {
            position: absolute;
            width: 46px; height: 46px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
            color: #52525b; font-size: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid #e4e4e7;
        }
        .wheel-tool:hover {
            transform: scale(1.15);
            color: #6366f1;
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.2);
        }

        /* Posicionamiento radial matemático de la rueda (Semicírculo Izquierdo) */
        .tool-1 { top: 10%; left: 30%; }
        .tool-2 { top: 30%; left: 5%; }
        .tool-3 { top: 60%; left: 5%; }
        .tool-4 { top: 80%; left: 30%; }

    </style>
</head>
<body>

    <!-- Lienzo (Canvas simulado) -->
    <div class="canvas-bg"></div>

    <!-- Capa Estructural de UI -->
    <div class="ui-layer">

        <!-- 1. Menú Superior Izquierdo -->
        <div class="top-left-menu ui-element cursor-pointer hover:bg-gray-50" onclick="toggleChat()">
            <i class="fas fa-bars text-gray-600 text-lg"></i>
            <div class="w-px h-5 bg-gray-200 mx-1"></div>
            <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full"></div>
            <span class="font-bold text-gray-800 text-sm">Antigravity OS</span>
        </div>

        <!-- 2. Columna de Chat -->
        <div class="chat-column ui-element" id="chatColumn">
            <!-- Chat Header -->
            <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-white/50 rounded-t-2xl">
                <h2 class="font-bold text-gray-800"><i class="fas fa-comment-dots text-indigo-500 mr-2"></i>Swarm Chat</h2>
                <button onclick="toggleChat()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            
            <!-- Chat Messages Area -->
            <div class="flex-1 p-5 overflow-y-auto flex flex-col gap-4">
                <!-- Msg 1 -->
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-xs font-bold mt-1">N</div>
                    <div class="bg-gray-100 rounded-2xl rounded-tl-sm p-3 text-sm text-gray-700 w-full">
                        He analizado la estructura de la interfaz. ¿Deseas que mapee los nodos del lienzo ahora?
                    </div>
                </div>
                <!-- Msg 2 -->
                <div class="flex gap-3 flex-row-reverse">
                    <div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-white text-xs font-bold mt-1">U</div>
                    <div class="bg-indigo-500 text-white rounded-2xl rounded-tr-sm p-3 text-sm w-full">
                        Sí, colócalos en el centro del espacio.
                    </div>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="p-4 border-t border-gray-100 bg-white/50 rounded-b-2xl">
                <div class="relative">
                    <input type="text" placeholder="Escribe al enjambre..." class="w-full bg-gray-100 border-none rounded-full py-2.5 pl-4 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                    <button class="absolute right-2 top-1/2 transform -translate-y-1/2 w-8 h-8 flex items-center justify-center text-indigo-500 hover:bg-indigo-50 rounded-full">
                        <i class="fas fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. Pomodoro & Reproductor -->
        <div class="dynamic-island ui-element">
            <!-- Pomodoro -->
            <div class="flex items-center gap-3 pr-4 border-r border-gray-200">
                <button class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-indigo-100 hover:text-indigo-600 flex items-center justify-center transition">
                    <i class="fas fa-play text-xs ml-0.5"></i>
                </button>
                <div class="font-mono text-xl font-bold text-gray-800 tracking-tight">25:00</div>
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wide mt-1">Focus</span>
            </div>
            
            <!-- Music Player -->
            <div class="flex items-center gap-4 pl-1">
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-gray-800 line-clamp-1">Lofi Chill Beats</span>
                    <span class="text-[10px] text-gray-500">Antigravity Radio</span>
                </div>
                <div class="flex gap-2 text-gray-400">
                    <i class="fas fa-step-backward hover:text-gray-800 cursor-pointer transition"></i>
                    <i class="fas fa-pause hover:text-gray-800 cursor-pointer transition"></i>
                    <i class="fas fa-step-forward hover:text-gray-800 cursor-pointer transition"></i>
                </div>
            </div>
        </div>

        <!-- 4. Rueda Circular (Estilo Concepts App) -->
        <div class="concepts-wheel ui-element">
            <!-- Botón Central (Herramienta Activa) -->
            <div class="wheel-center" title="Herramienta Actual (Pincel)">
                <i class="fas fa-paint-brush"></i>
            </div>
            
            <!-- Herramientas en el Semicírculo -->
            <div class="wheel-tool tool-1" title="Seleccionar">
                <i class="fas fa-mouse-pointer"></i>
            </div>
            <div class="wheel-tool tool-2" title="Conector / Lazo">
                <i class="fas fa-project-diagram"></i>
            </div>
            <div class="wheel-tool tool-3" title="Goma de Borrar">
                <i class="fas fa-eraser"></i>
            </div>
            <div class="wheel-tool tool-4" title="Agregar Agente / Nodo">
                <i class="fas fa-robot"></i>
            </div>
        </div>

    </div>

    <script>
        // Lógica para abrir/cerrar el menú de chat
        function toggleChat() {
            const chat = document.getElementById('chatColumn');
            chat.classList.toggle('open');
        }

        // Simulación sencilla de arrastre del lienzo (pan)
        const canvas = document.querySelector('.canvas-bg');
        let isDown = false;
        let startX, startY;
        let scrollLeft, scrollTop;

        canvas.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - canvas.offsetLeft;
            startY = e.pageY - canvas.offsetTop;
            scrollLeft = canvas.offsetLeft;
            scrollTop = canvas.offsetTop;
        });

        canvas.addEventListener('mouseleave', () => { isDown = false; });
        canvas.addEventListener('mouseup', () => { isDown = false; });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - canvas.offsetLeft;
            const y = e.pageY - canvas.offsetTop;
            const walkX = (x - startX);
            const walkY = (y - startY);
            // La ilusión de paneo se hace moviendo el background-position
            canvas.style.backgroundPosition = `${walkX}px ${walkY}px`;
        });
    </script>
</body>
</html>
