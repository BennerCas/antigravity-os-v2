name: Release Tauri App
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install frontend deps
        working-directory: ./apps/web-app
        run: npm ci
      - name: build frontend
        working-directory: ./apps/web-app
        run: npm run build
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - name: build tauri
        working-directory: ./apps/web-app
        run: npx tauri build
      - name: create release
        uses: softprops/action-gh-release@v1
        with:
          files: apps/web-app/src-tauri/target/release/bundle/msi/*.msi
